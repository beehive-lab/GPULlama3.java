name: GPULlama3 Build & Run

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

env:
  JAVA_VERSION: 21.0.2-open
  JAVA_VERSION_25: 25.0.2-open
  MODELS_DIR: /opt/models
  QUARKUS_PORT: 8081
  # The Quarkus extension that consumes this project. Its GPULlama3 module tracks the public
  # facade, so it is pinned to the branch matching this repository's surface rather than to
  # quarkiverse's default branch, which lags it.
  QUARKUS_LANGCHAIN4J_REPO: https://github.com/orionpapadakis/quarkus-langchain4j.git
  QUARKUS_LANGCHAIN4J_REF: gpu-llama3/facade-1.0.0
  # History file committed back to the repo on push to main
  PERF_HISTORY_FILE: docs/perf-history.jsonl

jobs:
  code-quality:
    if: github.repository == 'beehive-lab/GPULlama3.java'
    runs-on: [self-hosted, Linux]
    timeout-minutes: 30

    steps:
      - name: Checkout GPULlama3
        uses: actions/checkout@v4

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Check code formatting (Spotless)
        run: ./mvnw -T12C -Pspotless spotless:check

      - name: Run the Python tooling tests
        run: make test-scripts

  # Linux build and Class A gates, on both published JDK lines. The artifact coordinates and
  # the TornadoVM line both follow from the JDK the build runs on (pom.xml's jdk21/jdk25
  # profiles), so a line that is never compiled here is a line nobody has checked.
  #
  # Split from the macOS job rather than expressed as one matrix with an `os` dimension: jobs
  # depend on jobs, not on matrix cells, so with one `build` job an unavailable Mac runner
  # leaves every Linux consumer queued behind it.
  build-linux:
    if: github.repository == 'beehive-lab/GPULlama3.java'
    runs-on: [self-hosted, Linux]
    needs: code-quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        backend: [opencl, cuda]
        jdk: ['21', '25']

    steps:
      - name: Checkout GPULlama3
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ matrix.jdk == '25' && env.JAVA_VERSION_25 || env.JAVA_VERSION }}

      - name: Setup TornadoVM
        uses: ./.github/actions/setup-tornadovm
        env:
          TORNADO_ROOT: ${{ runner.tool_cache }}/tornadovm/tornadovm-${{ matrix.backend }}-jdk${{ matrix.jdk }}
        with:
          backend: ${{ matrix.backend }}
          jdk: ${{ matrix.jdk }}

      - name: Build and unit-test GPULlama3.java
        run: |
          # No `versions:set` and no `-Dtornadovm.version`: both would overwrite what the JDK
          # profile resolved, which is the mechanism being tested. The version is read back
          # afterwards so downstream steps name the artifact the build actually produced.
          ./mvnw clean install
          GPULLAMA3_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "GPULlama3 version: $GPULLAMA3_VERSION"
          echo "GPULLAMA3_VERSION=$GPULLAMA3_VERSION" >> $GITHUB_ENV

      - name: Check the artifact matches the JDK that built it
        run: |
          set -euo pipefail
          EXPECTED_SUFFIX="-jdk${{ matrix.jdk }}"
          case "$GPULLAMA3_VERSION" in
            *"$EXPECTED_SUFFIX") ;;
            *) echo "::error::JDK ${{ matrix.jdk }} produced $GPULLAMA3_VERSION, which does not end in $EXPECTED_SUFFIX"; exit 1 ;;
          esac
          # 21 -> class major 65, 25 -> 69.
          EXPECTED_MAJOR=$(( 44 + ${{ matrix.jdk }} ))
          JAR="target/gpu-llama3-${GPULLAMA3_VERSION}.jar"
          MAJOR=$("$JAVA_HOME/bin/javap" -verbose -classpath "$JAR" \
            org.beehive.gpullama3.model.Model | awk '/major version:/ { print $3; exit }')
          if [ "$MAJOR" != "$EXPECTED_MAJOR" ]; then
            echo "::error::$JAR has class major $MAJOR, expected $EXPECTED_MAJOR"; exit 1
          fi
          # The seven provider/architecture SPIs. A missing one loses a model family at runtime
          # and nothing else notices until a load fails.
          SERVICES=$("$JAVA_HOME/bin/jar" tf "$JAR" | grep -c '^META-INF/services/org\.beehive\.' || true)
          if [ "$SERVICES" != "7" ]; then
            echo "::error::$JAR declares $SERVICES project service files, expected 7"
            "$JAVA_HOME/bin/jar" tf "$JAR" | grep '^META-INF/services/' || true
            exit 1
          fi
          echo "$JAR: version $GPULLAMA3_VERSION, class major $MAJOR, $SERVICES service files"

      - name: Launcher smoke test
        run: |
          set -euo pipefail
          export LLAMA_ROOT="${{ github.workspace }}"
          ./llama-tornado --help > /dev/null
          # --show-command without --execute-after-show builds the whole JVM command line,
          # which is what proves the SDK argfile was found and read.
          ./llama-tornado --show-command --gpu \
            --model "$MODELS_DIR/Llama-3.2-1B-Instruct-F16.gguf" --prompt hi \
            | tee /tmp/llama-command.txt > /dev/null
          # `if` blocks, not AND/OR lists: under `bash -e` a list whose final status is
          # non-zero terminates the step, so the negative check below would fail the job
          # precisely when it passes.
          if ! grep -q -- "@$TORNADOVM_HOME/tornado-argfile" /tmp/llama-command.txt; then
            echo "::error::launcher did not use the SDK argfile"
            cat /tmp/llama-command.txt
            exit 1
          fi
          if grep -q -- "-XX:+EnableJVMCI" /tmp/llama-command.txt; then
            echo "::error::launcher hardcodes a JVMCI flag again; it must come from the SDK argfile"
            exit 1
          fi
          echo "launcher command built from the SDK argfile"

  build-macos:
    if: github.repository == 'beehive-lab/GPULlama3.java'
    runs-on: [self-hosted, macOS]
    needs: code-quality
    timeout-minutes: 45

    steps:
      - name: Checkout GPULlama3
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Setup TornadoVM
        uses: ./.github/actions/setup-tornadovm
        env:
          TORNADO_ROOT: ${{ runner.tool_cache }}/tornadovm/tornadovm-metal-jdk21
        with:
          backend: metal
          jdk: '21'

      - name: Build and unit-test GPULlama3.java
        run: ./mvnw clean install

  standalone-inference-linux:
    if: github.repository == 'beehive-lab/GPULlama3.java'
    needs: build-linux
    strategy:
      fail-fast: false
      matrix:
        backend: [opencl, cuda]
    uses: ./.github/workflows/standalone-inference.yml
    with:
      backend: ${{ matrix.backend }}
      runner_os: Linux

  standalone-inference-macos:
    if: github.repository == 'beehive-lab/GPULlama3.java'
    needs: build-macos
    uses: ./.github/workflows/standalone-inference.yml
    with:
      backend: metal
      runner_os: macOS
      # The same 22 rows take far longer on the Mac than on the CUDA/OpenCL machine --
      # Phi-3-mini in FP16 alone ran past the 40-minute wall there, cancelling the job
      # after seven rows had verified. The budget is per machine, not per matrix.
      timeout_minutes: 120

  # Test integration with Quarkus-langchain4j
  quarkus-langchain4j-integration:
    if: github.repository == 'beehive-lab/GPULlama3.java'
    runs-on: [self-hosted, Linux]
    needs: build-linux
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Linux only: the extension is exercised here as a consumer of the public facade,
        # and the backend it runs on is not what this job is checking.
        backend: [opencl, cuda]

    steps:
      - name: Checkout GPULlama3
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Setup TornadoVM
        uses: ./.github/actions/setup-tornadovm
        env:
          TORNADO_ROOT: ${{ runner.tool_cache }}/tornadovm/tornadovm-${{ matrix.backend }}-jdk21
        with:
          backend: ${{ matrix.backend }}
          jdk: '21'

      - name: Build GPULlama3 for this leg
        run: |
          ./mvnw -q clean install -DskipTests
          echo "GPULLAMA3_VERSION=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      - name: Clone the Quarkus LangChain4j extension
        run: |
          rm -rf quarkus-langchain4j
          git clone --depth 1 --branch "$QUARKUS_LANGCHAIN4J_REF" \
            "$QUARKUS_LANGCHAIN4J_REPO" quarkus-langchain4j

      - name: Build the Quarkus LangChain4j extension against this build
        run: |
          cd ${{ github.workspace }}/quarkus-langchain4j
          # -i.bak (extension glued to the flag) is the portable form: GNU sed accepts it and
          # BSD sed requires it — a bare `-i ''` is parsed as the script on BSD sed.
          sed -i.bak 's/<gpu-llama3\.version>.*<\/gpu-llama3\.version>/<gpu-llama3.version>'$GPULLAMA3_VERSION'<\/gpu-llama3.version>/' pom.xml
          rm -f pom.xml.bak
          # -Dtornado activates the TornadoVM profile; -am builds only the gpu-llama3 module + deps
          mvn -q clean install -pl integration-tests/gpu-llama3 -am -DskipTests -Dtornado

      - name: Verify GPULlama3 Dependency
        run: |
          cd ${{ github.workspace }}/quarkus-langchain4j/integration-tests/gpu-llama3
          mvn dependency:tree | grep "io.github.beehive-lab:gpu-llama3:jar:$GPULLAMA3_VERSION"

      - name: Seed GPULlama3 model cache (avoid HuggingFace download on cold runners)
        shell: bash
        run: |
          set -euo pipefail
          # The Quarkus gpu-llama3 extension lazily downloads the model from HuggingFace into
          # ~/.langchain4j/models on first request, via a no-timeout HttpClient — which hangs
          # until the job wall on a cold-cache runner. The model is already provisioned under
          # $MODELS_DIR, so we point the cache at it and touch the ".finished" marker that
          # GPULlama3ModelRegistry's cache guard checks, so the download is skipped.
          #
          # Coordinates are read from the integration test's application.properties (falling
          # back to the extension's @WithDefault values), and the cache path is derived the
          # same way the extension does, so this follows an upstream model change instead of
          # silently mismatching. Layout: {home}/.langchain4j/models/{owner}_{name}/{file}
          # where file = name (minus a trailing "-GGUF") + "-<quant>.gguf".
          PROPS="${{ github.workspace }}/quarkus-langchain4j/integration-tests/gpu-llama3/src/main/resources/application.properties"
            
          prop() {  # exact key match, skips comments, trims; prints empty if unset
            awk -F= -v k="$1" '
              /^[[:space:]]*#/ { next }
              { key=$1; gsub(/^[[:space:]]+|[[:space:]]+$/,"",key)
                if (key==k) { v=$0; sub(/^[^=]*=/,"",v); gsub(/^[[:space:]]+|[[:space:]]+$/,"",v); print v } }
            ' "$PROPS" | tail -n1
          }
            
          MODEL_NAME="$(prop quarkus.langchain4j.gpu-llama3.chat-model.model-name)"
          QUANT="$(prop quarkus.langchain4j.gpu-llama3.chat-model.quantization)"
          : "${MODEL_NAME:=unsloth/Llama-3.2-1B-Instruct-GGUF}"   # Consts.DEFAULT_CHAT_MODEL_NAME
          : "${QUANT:=F16}"                                       # Consts.DEFAULT_CHAT_MODEL_QUANTIZATION
            
          if [[ "$MODEL_NAME" != */* ]]; then
            echo "::error::Model name '$MODEL_NAME' is not in owner/name form; cannot derive cache path"; exit 1
          fi
          OWNER="${MODEL_NAME%%/*}"
          NAME="${MODEL_NAME#*/}"
          FILE="${NAME%-GGUF}-${QUANT}.gguf"                     # strip trailing -GGUF, append -<quant>.gguf
          CACHE_DIR="$HOME/.langchain4j/models/${OWNER}_${NAME}"
          MODEL_SRC="$MODELS_DIR/$FILE"
            
          echo "Configured model: $MODEL_NAME ($QUANT) -> file=$FILE  dir=${OWNER}_${NAME}"
          if [ ! -f "$MODEL_SRC" ]; then
            echo "::error::No local model at $MODEL_SRC for configured model '$MODEL_NAME' ($QUANT)."
            echo "::error::Provision it under \$MODELS_DIR, or pin the quarkus-langchain4j clone to a ref whose model is available locally."
            exit 1
          fi
          mkdir -p "$CACHE_DIR"
          ln -sf "$MODEL_SRC" "$CACHE_DIR/$FILE"
           touch "$CACHE_DIR/.finished"
          echo "Seeded model cache:"; ls -la "$CACHE_DIR"

      - name: Start Quarkus Application
        run: |
          cd ${{ github.workspace }}/quarkus-langchain4j/integration-tests/gpu-llama3
          APP_LOG="${{ runner.temp }}/quarkus-app.log"
          echo "APP_LOG=$APP_LOG" >> $GITHUB_ENV
          # Background process output stops being captured by the Actions log once this
          # step ends, so redirect it to a file we can dump later if a request fails.
          #
          # -Dtornado.device.memory here is dead: the gpu-llama3 extension's ChatModelConfig
          # defaults device-memory to "4GB" and calls System.setProperty("tornado.device.memory", ...)
          # itself during model init, overwriting whatever we pass as a bare JVM flag. On Metal
          # that 4GB budget isn't enough even for Llama-3.2-1B in batch-prefill-decode mode
          # (TornadoOutOfMemoryException), so override the actual Quarkus config property instead.
          # --add-modules jdk.incubator.vector: FloatTensor's static initializer reads
          # VectorShape, so without it every request dies with
          # NoClassDefFoundError: jdk/incubator/vector/VectorShape and the endpoint 500s.
          # The tornado argfile does not supply it; every other run in this workflow passes
          # it explicitly.
          java  @"$TORNADOVM_HOME/tornado-argfile" \
                --add-modules jdk.incubator.vector \
                -Dquarkus.langchain4j.gpu-llama3.chat-model.device-memory=8GB \
                -Dquarkus.http.port=$QUARKUS_PORT \
                -jar target/quarkus-app/quarkus-run.jar > "$APP_LOG" 2>&1 &
          APP_PID=$!
          echo "APP_PID=$APP_PID" >> $GITHUB_ENV
          for i in {1..30}; do
            if curl -s http://localhost:$QUARKUS_PORT/q/health > /dev/null 2>&1; then
              echo "Application ready after ${i} seconds"
              break
            elif [ $i -eq 30 ]; then
              echo "::error::Application failed to start within 30 seconds"
              kill $APP_PID || true
              exit 1
            else
              [ $((i % 5)) -eq 0 ] && echo "Still waiting... (${i}s)"
              sleep 1
            fi
          done

      - name: Trigger Blocking Endpoint
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3 for blocking endpoint..."
            HTTP_RESPONSE=$(curl -s -w "%{http_code}" http://localhost:$QUARKUS_PORT/chat/blocking)
            HTTP_CODE="${HTTP_RESPONSE: -3}"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "SUCCESS: HTTP $HTTP_CODE"
              echo "Response body: ${HTTP_RESPONSE%???}"
              break
            fi
            echo "Failed: HTTP $HTTP_CODE"
            [ $attempt -lt 3 ] && sleep 2
            [ $attempt -eq 3 ] && { echo "::error::Blocking endpoint failed after 3 attempts"; exit 1; }
          done

      - name: Trigger Streaming Endpoint
        run: |
          for attempt in 1 2 3; do
            echo "Attempt $attempt of 3 for streaming endpoint..."
            # curl's own --max-time (not the external `timeout` command, which stock
            # macOS doesn't ship) so this works the same on both runner OSes.
            HTTP_CODE=$(curl -s --max-time 10 -o /dev/null -w "%{http_code}" http://localhost:$QUARKUS_PORT/chat/streaming)
            if [ "$HTTP_CODE" = "200" ]; then
              echo "SUCCESS: HTTP $HTTP_CODE"
              break
            fi
            echo "Failed: HTTP $HTTP_CODE"
            [ $attempt -lt 3 ] && sleep 2
            [ $attempt -eq 3 ] && { echo "::error::Streaming endpoint failed after 3 attempts"; exit 1; }
          done

      - name: Dump Quarkus Application Log
        if: failure()
        run: cat "$APP_LOG" || true

      - name: Cleanup & Shutdown
        if: always()
        run: |
          kill $APP_PID || true
          wait $APP_PID 2>/dev/null || true

  # ── Benchmark gate (M1.7 / T1.7) ────────────────────────────────────────────
  #
  # The gate that was written in M1 and never wired up, because it was waiting on
  # #142 (which landed) and #146. It measures one pinned tuple and compares the median
  # eval_rate against the most recent gate-passing entry for the same tuple in
  # docs/perf-history.jsonl, failing on a regression beyond tolerance.
  #
  # Deliberately NOT --append: publish-performance-history below is what records runs,
  # and two writers would race for the same file and double-count the same run.
  #
  # Push to main only, for the same reason that job is: a PR from a fork cannot be
  # trusted with the history, and a gate that runs on unpinned hardware compares against
  # the wrong baseline. scripts/perf-gate-tolerances.json is where a machine's tolerance
  # (or record-only status) is declared.
  performance-gate:
    if: >-
      github.repository == 'beehive-lab/GPULlama3.java' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Linux]
    needs: standalone-inference-linux
    timeout-minutes: 30

    steps:
      - name: Checkout GPULlama3
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Set up Java
        uses: ./.github/actions/setup-java
        with:
          java_version: ${{ env.JAVA_VERSION }}

      - name: Setup TornadoVM
        uses: ./.github/actions/setup-tornadovm
        env:
          TORNADO_ROOT: ${{ runner.tool_cache }}/tornadovm/tornadovm-cuda-jdk21
        with:
          backend: cuda
          jdk: '21'

      - name: Build
        run: ./mvnw -q -B clean package -DskipTests

      - name: Gate Llama-3.2-1B-Instruct-Q8_0 on CUDA
        run: |
          # GitHub runs this with `bash -e`, so the gate's own non-zero exit would abort
          # the step before its status could be read. errexit off for the call, and
          # PIPESTATUS[0] rather than $? because the output goes through tee.
          set +e
          set -o pipefail
          scripts/perf-gate-run.sh \
            --model-file Llama-3.2-1B-Instruct-Q8_0.gguf \
            --model Llama-3.2-1B-Instruct \
            --quantization Q8_0 \
            --backend cuda \
            --machine "${{ runner.name }}" 2>&1 | tee gate-q8.log
          status=${PIPESTATUS[0]}
          set -e

          # The gate's exit codes: 0 pass or record-only, 1 regression, 2 unstable, 3 usage.
          case "$status" in
            0) echo "benchmark gate passed" ;;
            2) echo "::warning::benchmark gate could not measure reliably — a machine too"\
                    " noisy to measure has said nothing about the code; see gate-q8.log" ;;
            *) echo "::error::benchmark gate failed with status $status; see gate-q8.log"
               exit "$status" ;;
          esac

      - name: Upload gate log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-gate-${{ github.run_id }}
          path: gate-*.log
          if-no-files-found: warn

  # Collect all matrix metrics and update history
  publish-performance-history:
    # Guard: only commit history on real pushes to main, not on PRs or forks.
    # Prevents duplicate entries from PR runs and avoids push-permission errors on forks.
    if: >-
      github.repository == 'beehive-lab/GPULlama3.java' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: [self-hosted, Linux]
    needs: standalone-inference-linux
    timeout-minutes: 15

    steps:
      - name: Checkout GPULlama3
        uses: actions/checkout@v4

      - name: Download metrics artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: metrics-*-${{ github.run_id }}
          path: ${{ runner.temp }}/metrics-artifacts
          merge-multiple: true

      - name: Append to performance history
        run: |
          # Gate tuple fields (M1.7): a row missing any of these can never serve as a
          # baseline, so they are derived here rather than left null.
          GPU_NAME="$(nvidia-smi --query-gpu=name --format=csv,noheader 2>/dev/null | head -1)"
          TVM_VERSION="$(sed -n 's:.*<tornadovm.base.version>\(.*\)</tornadovm.base.version>.*:\1:p' pom.xml | head -1)"
          python3 scripts/process_metrics.py \
            --metrics-dir "${{ runner.temp }}/metrics-artifacts" \
            --gpu "$GPU_NAME" \
            --tornadovm-version "$TVM_VERSION" \
            --cache-warm true \
            --commit "${{ github.sha }}" \
            --branch "${{ github.ref_name }}" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --workflow "${{ github.workflow }}" \
            --machine "${{ runner.name }}" \
            --history "$PERF_HISTORY_FILE"

      - name: Commit performance history
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-8)

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "$PERF_HISTORY_FILE"

          git diff --cached --quiet && \
            echo "No history changes to commit" && exit 0

          git commit -m "perf: record run #${{ github.run_number }} @ ${SHORT_SHA}"

          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && break || {
              if [ $attempt -lt 3 ]; then
                echo "Attempt $attempt failed, retrying in $((attempt * 5))s..."
                sleep $((attempt * 5))
              else
                echo "::error::Failed to push after 3 attempts"
                exit 1
              fi
            }
          done
